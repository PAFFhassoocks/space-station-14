- type: gameMap
  id: MeteorArena
  mapName: Meteor Arena
  mapPath: /Maps/Nonstations/meteor-arena.yml
  minPlayers: 0
  stations:
    Arena:
      stationProto: StandardStationArena
      components:
        - type: StationNameSetup
          mapNameTemplate: "Meteor Arena"
        - type: StationJobs
          availableJobs:
            Passenger: [ -1, -1 ]
- type: gameMap
  id: dm01-entryway
  mapName: DM01 Entryway
  mapPath: /Maps/Nonstations/dm01-entryway.yml
  minPlayers: 0
  stations:
    dm01-entryway:
      stationProto: StandardStationArena
      components:
        - type: StationNameSetup
          mapNameTemplate: "DM01 Entryway"
        - type: StationJobs
          availableJobs:
            Passenger: [ -1, -1 ]
- type: gameMap
  id: CentCommDeathMatch
  isGrid: true # Did you know that centcomm is the only "game map" that isn't actually a map? Send help.
  mapName: 'Central Death Match Command'
  mapPath: /Maps/centcomm.yml
  minPlayers: 0
  stations:
    centcomm:
      stationProto: NanotrasenCentralCommand
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Central Command {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'TG'
      - type: StationJobs
        availableJobs:
          Passenger: [ -1, -1 ]
